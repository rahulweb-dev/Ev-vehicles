# Hourly trigger for the AI news desk (Vercel Hobby only allows daily crons).
# Repo → Settings → Secrets and variables → Actions:
#   SITE_URL          e.g. https://www.evradar.in
#   SCHEDULER_SECRET  same value as the SCHEDULER_SECRET env var on Vercel
name: AI news desk

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish due + generate next article
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/auto-news"
